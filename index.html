<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sagu | 保存投稿検索</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fa;color:#14213d;margin:0}main{max-width:760px;margin:auto;padding:26px 16px}h1{color:#315ed4;margin:0}header{margin:12px 0 24px}small,.muted{color:#697993}.card{background:#fff;padding:20px;margin:14px 0;border-radius:17px;box-shadow:0 2px 12px #14213d08}input,textarea,button{font:inherit}input[type=search],input[type=url],input[type=text],textarea{width:100%;padding:13px;border:1px solid #cad5e8;border-radius:10px;margin:8px 0;font-size:16px}button,.link{background:#e8efff;color:#274da1;border:0;border-radius:9px;padding:11px 14px;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}.primary{background:#315ed4;color:white}.result{border-bottom:1px solid #e7ebf3;padding:16px 0}.result:last-child{border:0}.result h3{margin:6px 0;overflow-wrap:anywhere}.preview{white-space:pre-wrap;overflow-wrap:anywhere;color:#596781;line-height:1.55;max-height:9em;overflow:hidden}.row{display:flex;gap:8px;flex-wrap:wrap}.meta{font-size:.8em;color:#7182a0}#status{color:#2856ae;overflow-wrap:anywhere}summary{cursor:pointer;font-weight:600}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #315ed4}
</style></head><body><main><header><h1>🔖 Sagu</h1><small>あの保存、どこだっけ？　AI不要・端末内検索</small></header>
<section class="card"><input type="search" id="search" placeholder="沖縄、筋トレ、バッグ…" aria-label="検索"><p id="count" class="muted">0件</p><div id="results"></div></section>
<section class="card"><h2>過去の保存投稿を取り込む</h2><p class="muted">Instagramから取得した <code>saved_posts.json</code> を選択してください。GitHubにはアップロードされません。</p><input id="file" type="file" accept=".json,application/json"><p id="status" role="status"></p></section>
<section class="card"><details><summary>＋ 新しい投稿を追加</summary><input id="url" type="url" placeholder="Instagramの投稿URL"><input id="title" type="text" placeholder="タイトル"><textarea id="memo" placeholder="検索用メモ・タグ"></textarea><button id="add" class="primary">保存する</button></details></section>
<section class="card"><button id="backup">データをバックアップ</button><p class="muted">データはこの端末・ブラウザ内に保存。Safariの履歴やWebサイトデータを消すと失われる場合があります。元のJSONも保管してください。</p></section></main>
<script>
'use strict';
const KEY='sagu_data_v1';
const $=id=>document.getElementById(id);
let posts=[];
// InstagramのエクスポートはUTF-8のバイトをLatin-1文字として格納することがある。
// Unicodeの混在にも対応するため、文字化け区間だけを復元する。
function repair(v){
 if(typeof v!=='string')return '';
 if(!/[\u00c3\u00e3\u00e5\u00e6\u00e7\u00e8\u00e9\u00ef\u00f0\u00c2\u00e2]/.test(v))return v;
 return v.replace(/[\u0080-\u00ff]+/g,segment=>{
  if(!/[\u00c3\u00e3\u00e5\u00e6\u00e7\u00e8\u00e9\u00ef\u00f0\u00c2\u00e2]/.test(segment))return segment;
  try{return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(segment,c=>c.charCodeAt(0)))}catch{return segment}
 });
}
// ASCIIが交じるUTF-8列にも対応するメイン修復処理。
function fix(v){
 if(typeof v!=='string')return '';
 // JSONの文字化けデータは通常Latin-1全域なので、一括復元を第一候補にする。
 if(/[\u00c3\u00e3\u00e5\u00e6\u00e7\u00e8\u00e9\u00ef\u00f0\u00c2\u00e2]/.test(v) && [...v].every(c=>c.charCodeAt(0)<=255)){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(v,c=>c.charCodeAt(0)))}catch{}
 }
 // 元から正しい日本語の箇所は維持し、変換可能な部分を修復。
 return repair(v);
}
function normalizeUrl(v){
 try{let u=new URL(v);if(!['instagram.com','www.instagram.com'].includes(u.hostname))return '';
 let m=u.pathname.match(/^\/(p|reel|tv)\/([a-zA-Z0-9_-]+)/);return m?`https://www.instagram.com/${m[1]}/${m[2]}/`:'';}catch{return ''}
}
function fromInstagram(data){
 if(!Array.isArray(data))throw Error('Instagramの saved_posts.json 形式ではありません');
 let out=[];
 for(let e of data){
  const v=Array.isArray(e.label_values)?e.label_values:[];
  let link=v.find(x=>x.label==='URL');let url=normalizeUrl(link?.href||link?.value||'');if(!url)continue;
  let caption=fix(v.find(x=>fix(x.label)==='キャプション')?.value||'');
  let title=caption.split('\n').map(s=>s.trim()).find(Boolean)||'保存した投稿';
  out.push({url,title:title.slice(0,150),caption,memo:'',date:Number(e.timestamp||0)});
 }
 return out;
}
function clean(p){return {...p,title:fix(p.title||''),caption:fix(p.caption||''),memo:fix(p.memo||'')};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(posts));return true}catch{alert('データを保存できませんでした。ブラウザの保存容量・設定を確認してください。');return false}}
function merge(list){
 const known=new Set(posts.map(p=>p.url));let added=0;
 for(let raw of list){let p=clean(raw);if(!p.url||known.has(p.url))continue;posts.push(p);known.add(p.url);added++}
 posts.sort((a,b)=>(b.date||0)-(a.date||0));persist();render();return added;
}
function render(){
 let terms=$('search').value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
 const found=posts.filter(p=>{let t=[p.title,p.caption,p.memo,p.url].join(' ').toLocaleLowerCase();return terms.every(w=>t.includes(w))});
 $('count').textContent=`${found.length}件表示 / 全${posts.length}件`;
 const root=$('results');root.replaceChildren();
 for(let p of found){
  const article=document.createElement('article');article.className='result';
  const h=document.createElement('h3');h.textContent=p.title;article.append(h);
  const preview=document.createElement('p');preview.className='preview';preview.textContent=(p.caption||p.memo||'説明文なし').slice(0,260);article.append(preview);
  const actions=document.createElement('div');actions.className='row';
  const a=document.createElement('a');a.className='link';a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Instagramで開く ↗';actions.append(a);
  const edit=document.createElement('button');edit.textContent='メモを編集';edit.onclick=()=>{const newText=prompt('検索用メモを入力',p.memo||'');if(newText===null)return;p.memo=newText;persist();render()};actions.append(edit);article.append(actions);root.append(article)
 }
}
$('file').addEventListener('change',async ev=>{const file=ev.target.files?.[0];if(!file)return;try{let incoming=fromInstagram(JSON.parse(await file.text()));const n=merge(incoming);$('status').textContent=`${n}件を追加しました。対象${incoming.length}件、重複${incoming.length-n}件。`;}catch(e){$('status').textContent='読み込みに失敗しました：'+e.message}ev.target.value=''});
$('search').addEventListener('input',render);
$('add').addEventListener('click',()=>{let url=normalizeUrl($('url').value.trim());if(!url)return alert('Instagramの投稿URLを入力してください');let n=merge([{url,title:$('title').value.trim()||'保存した投稿',memo:$('memo').value.trim(),caption:'',date:Date.now()/1000}]);alert(n?'保存しました':'登録済みです');if(n){$('url').value='';$('title').value='';$('memo').value=''}});
$('backup').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(posts,null,2)],{type:'application/json'});let object=URL.createObjectURL(blob),a=document.createElement('a');a.href=object;a.download='sagu_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(object),5000)});
try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');posts=Array.isArray(saved)?saved.map(clean):[];if(posts.length)persist()}catch{posts=[]}render();
</script></body></html>
